<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-indigo-700 via-purple-700 to-pink-600 min-h-screen flex items-center justify-center px-4">

    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute w-72 h-72 bg-pink-400 rounded-full opacity-20 blur-3xl -top-10 -left-10"></div>
        <div class="absolute w-96 h-96 bg-blue-400 rounded-full opacity-20 blur-3xl bottom-0 right-0"></div>
    </div>

    <div class="relative w-full max-w-md">

        <div class="backdrop-blur-xl bg-white/15 border border-white/20 rounded-3xl shadow-2xl p-8">

            <div class="text-center mb-8">

                <div class="w-20 h-20 mx-auto bg-white rounded-full flex items-center justify-center shadow-lg mb-4">
                    <i class="fas fa-user text-4xl text-indigo-600"></i>
                </div>

                <h1 class="text-3xl font-bold text-white">
                    Welcome Back
                </h1>

                <p class="text-gray-200 mt-2">
                    Login to continue
                </p>

            </div>

            <form method="post">
                {% csrf_token %}
                <!-- Email -->

                <div class="mb-5">
                    <label class="text-white text-sm mb-2 block">
                        Email Address
                    </label>

                    <div class="relative">

                        <span class="absolute left-4 top-3 text-gray-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>

                        <input type="email" name="email" placeholder="Enter your email"
                            class="w-full pl-12 pr-4 py-3 rounded-xl bg-white/80 outline-none focus:ring-4 focus:ring-indigo-300 transition">

                    </div>
                </div>

                <!-- Password -->

                <div class="mb-4">

                    <label class="text-white text-sm mb-2 block">
                        Password
                    </label>

                    <div class="relative">

                        <span class="absolute left-4 top-3 text-gray-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input id="password" name="password" type="password" placeholder="Enter password"
                            class="w-full pl-12 pr-12 py-3 rounded-xl bg-white/80 outline-none focus:ring-4 focus:ring-indigo-300 transition">

                        <button type="button" onclick="togglePassword()" class="absolute right-4 top-3 text-gray-500">

                            <i id="eyeIcon" class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <!-- Remember -->

                <div class="flex items-center justify-between mb-6">

                    <label class="flex items-center text-white text-sm cursor-pointer">

                        <input type="checkbox" class="mr-2 accent-indigo-600">

                        Remember Me

                    </label>

                    <a href="#" class="text-white hover:text-yellow-300 transition text-sm">
                        Forgot Password?
                    </a>

                </div>

                <!-- Login Button -->

                <button
                    class="w-full bg-white text-indigo-700 font-semibold py-3 rounded-xl hover:bg-indigo-700 hover:text-white transition duration-300 shadow-lg">

                    Login

                </button>

            </form>

            <!-- Divider -->

            <div class="flex items-center my-6">

                <hr class="flex-grow border-white/30">

                <span class="px-4 text-white text-sm">
                    OR
                </span>

                <hr class="flex-grow border-white/30">

            </div>

            <!-- Social Login -->



            <!-- Signup -->

            <div class="text-center mt-8 text-white">

                Don't have an account?

                <a href="/signup" class="font-semibold text-yellow-300 hover:underline">

                    Sign Up

                </a>

            </div>

        </div>

    </div>

    <script>

        function togglePassword() {

            let password = document.getElementById("password");
            let eye = document.getElementById("eyeIcon");

            if (password.type === "password") {

                password.type = "text";
                eye.classList.remove("fa-eye");
                eye.classList.add("fa-eye-slash");

            } else {

                password.type = "password";
                eye.classList.remove("fa-eye-slash");
                eye.classList.add("fa-eye");

            }

        }

    </script>

</body>

</html>
